<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 강의목록</title>
    <link rel="stylesheet" href="/src/css/ui/module/header.css">
    <link rel="stylesheet" href="/src/css/ui/module/sidebar.css">
    <link rel="stylesheet" href="/src/css/pages/student/lec_list.css">
    <link rel="stylesheet" href="/src/css/ui/module/graybox.css">
</head>
<body>
    <div id="header"></div>
    <div class="container">
        <div id="sidebar"></div>
        <div class="container-main">
            <div class="gb-container">
                <div class="gb-sub">
                    <div class="search-container">
                        <input type="text" class="lecture-search" placeholder="  과목명을 입력해주세요">
                        <button type="button" class="lecSearch_btn">검색</button>
                    </div>
                    <div class="filter-container">
                        <p class="filter-title">강의 필터</p>
                    
                        <div class="filter-group">
                            <label>학부</label>
                            <select name="college">
                                <option value="all-college" selected>전체</option>
                                <option value="medical_college">의과대학</option>
                                <option value="nursing_college">간호대학</option>
                                <option value="health_science_college">보건과학대학</option>
                                <option value="free_major_school">자유전공학부</option>
                                <option value="advanced_school">첨단학부</option>
                                <option value="natural_school">자연계열학부</option>
                                <option value="human_social_school">인문사회계열학부</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="major-filter">학과</label>
                            <select id="major-filter" class="major-select" disabled>
                                <option value="all-major" selected>전체</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="grade-filter">학년</label>
                            <select id="grade-filter" class="major-select" disabled>
                                <option value="all-grade" selected>전체</option>
                                <option value="first">1학년</option>
                                <option value="second">2학년</option>
                                <option value="third">3학년</option>
                                <option value="fourth">4학년</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label>구분</label>
                            <select name="sort">
                                <option value="all-sort" selected>전체</option>
                                <option value="m">전공</option>
                                <option value="e">교양</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label>요일</label>
                            <select name="week">
                                <option value="all-week" selected>전체</option>
                                <option value="mon">월요일</option>
                                <option value="tue">화요일</option>
                                <option value="wed">수요일</option>
                                <option value="thu">목요일</option>
                                <option value="fri">금요일</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label>학점</label>
                            <select name="score">
                                <option value="all-score" selected>전체</option>
                                <option value="1">1학점</option>
                                <option value="2">2학점</option>
                                <option value="3">3학점</option>
                            </select>
                        </div>
                    </div>

                    <div class="btn-container">
                        <button type="button" class="reset-btn">초기화</button>
                        <button type="button" class="check-btn">조회</button>
                    </div>
                </div>

                <div class="gb-main">
                    <div class="allLec-container">
                        <table class="allLec-table">
                            <thead>
                                <tr>
                                    <th>교과목 번호</th>
                                    <th>과목명</th>
                                    <th>구분</th>
                                    <th>학점</th>
                                    <th>시간</th>
                                    <th>신청</th>
                                </tr>
                            </thead>

                            <tbody id="allLecTableBody">

                            </tbody>

                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/js/layout/includeHeader.js"></script>
    <script type="module" src="/src/js/layout/includeStuSidebar.js"></script>

    <script type="module" src="/src/js/pages/student/lec_data.js"></script>

    <script type="module" src="/src/js/pages/student/filter.js"></script>
</body>
</html>
